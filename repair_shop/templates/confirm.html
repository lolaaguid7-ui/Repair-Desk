{% extends 'base.html' %}{% from 'macros.html' import icon,csrf %}
{% block content %}<section class="panel confirm-panel"><span class="empty-icon">{{ icon('orders',30) }}</span><div class="eyebrow">REVIEW BEFORE CONTINUING</div><h1>{{ title }}</h1><p>{{ message }}</p><form method="post">{{ csrf(csrf_token) }}<input type="hidden" name="confirmed" value="yes">{% for key,value in hidden.items() %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}<div class="form-actions"><a class="button secondary" href="{{ cancel_url }}" autofocus>Cancel</a><button class="button {{ 'danger' if danger else 'primary' }}">{{ action_label }}</button></div></form></section>{% endblock %}
